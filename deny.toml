# cargo deny --locked check: RustSec advisories, licences, duplicate
# crates, and sources limited to crates.io.

[graph]
all-features = false

[advisories]
# Unmaintained or yanked crates fail too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
